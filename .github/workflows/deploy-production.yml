name: Deploy to Production (DigitalOcean)

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Run Full Tests
        run: |
          npm ci
          npm run test:coverage

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry (DOCR)
        run: doctl registry login --expiry-seconds 1200

      - name: Build and Push Production Images
        run: |
          TAG=${GITHUB_REF_NAME:-latest}
          docker build -t registry.digitalocean.com/abs-registry/backend:${TAG} -t registry.digitalocean.com/abs-registry/backend:latest .
          docker push registry.digitalocean.com/abs-registry/backend:${TAG}
          docker push registry.digitalocean.com/abs-registry/backend:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Apply (Production)
        run: |
          cd terraform
          terraform init
          terraform apply -var-file="environments/prod.tfvars" -var="do_token=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" -auto-approve

      - name: Export OpenAPI Spec & Trigger KMP SDK Sync
        run: |
          npm run spec:export
          echo "OpenAPI spec exported for KMP client consumption"
