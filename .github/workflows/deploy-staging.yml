name: Deploy to Staging (DigitalOcean)

on:
  release:
    types: [ published ]
  push:
    branches: [ staging, 'releases/**' ]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Run Tests
        run: |
          npm ci
          npm run test:coverage

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry (DOCR)
        run: doctl registry login --expiry-seconds 1200

      - name: Build and Push Staging Image
        run: |
          REGISTRY="${{ secrets.DIGITALOCEAN_REGISTRY_NAME || 'abs-registry' }}"
          TAG="${GITHUB_REF_NAME:-staging}"
          docker build -t registry.digitalocean.com/${REGISTRY}/backend:staging -t registry.digitalocean.com/${REGISTRY}/backend:${TAG} .
          docker push registry.digitalocean.com/${REGISTRY}/backend:staging
          docker push registry.digitalocean.com/${REGISTRY}/backend:${TAG}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Apply (Staging)
        run: |
          cd terraform
          terraform init
          REGISTRY="${{ secrets.DIGITALOCEAN_REGISTRY_NAME || 'abs-registry' }}"
          terraform apply \
            -var-file="environments/staging.tfvars" \
            -var="do_token=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" \
            -var="docr_repository=${REGISTRY}/backend" \
            -auto-approve

